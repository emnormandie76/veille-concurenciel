name: CI — Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, devresearch]

# Pas de déploiement Vercel — validation uniquement
# Le déploiement sera ajouté dans une étape ultérieure

jobs:
  validate:
    name: Lint, Types & Migrations
    runs-on: ubuntu-latest

    env:
      # Variables requises par Prisma & Next.js pour le build de validation
      # À configurer dans Settings > Secrets and variables > Actions sur GitHub
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Même version majeure que le poste de développement (v24.21.0).
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ─── Prisma ───────────────────────────────────────────────────────────
      # DOIT précéder tsc et ESLint. `npm ci` ne génère plus le client : le
      # hook postinstall a disparu avec Prisma 7 et package.json n'en déclare
      # aucun. Sans cette étape, `@prisma/client` n'exporte pas `PrismaClient`
      # (TS2305) et tsc part en cascade de ~40 TS7006 sur tous les callbacks
      # Prisma, qui perdent leur type. C'est ce qui faisait échouer la CI
      # depuis son tout premier run.
      - name: Prisma — génération du client
        run: npx prisma generate

      # ─── TypeScript ───────────────────────────────────────────────────────
      - name: TypeScript — vérification des types
        run: npx tsc --noEmit

      # ─── Lint ─────────────────────────────────────────────────────────────
      - name: ESLint
        run: npm run lint

      - name: Prisma — validation du schéma
        run: npx prisma validate

      - name: Prisma — statut des migrations (base de dev)
        # Bloque uniquement sur les branches d'integration (main, devresearch)
        # et sur les PR vers main. Ailleurs l'etape s'execute et affiche son
        # verdict, mais ne fait pas echouer le job.
        #
        # Pourquoi : cette etape interroge la base Neon PARTAGEE. Une branche
        # qui ajoute une migration echouait donc tant que cette migration
        # n'avait pas ete appliquee a la base commune — c'est-a-dire avant
        # meme que le code soit relu. Trois branches ont bute dessus le
        # 2 septembre 2026. Le constat est deplace la ou il est actionnable :
        # a l'integration, quand appliquer la migration est bien l'etape
        # suivante.
        #
        # Ce n'est qu'un palliatif. Le correctif de fond est un service
        # Postgres ephemere dans le job — voir
        # docs/memory/memory-deploiement-vercel.md, "Base de CI ephemere".
        run: npx prisma migrate status
        continue-on-error: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devresearch' || github.base_ref == 'main') }}

      # ─── Garde-fou : interdire la synchro de schema sans migration ───────
      - name: Sécurité — détecter une synchro de schema hors migration
        run: |
          # Le motif est ecrit en classes de caracteres pour ne PAS se trouver
          # lui-meme : le garde-fou scanne .github/, donc une recherche du
          # litteral matchait sa propre source et echouait systematiquement.
          # C'etait le cas depuis le premier run — masque par l'echec anterieur
          # de tsc, qui empechait d'atteindre cette etape.
          MOTIF='prisma[[:space:]]+db[[:space:]]+push'
          echo "Recherche d'une synchro de schema dans les scripts CI et package.json..."
          if grep -rEn "$MOTIF" .github/ package.json 2>/dev/null; then
            echo "❌ ERREUR : synchro de schema detectee dans un script CI ou package.json."
            echo "   Utiliser 'prisma migrate deploy' en CI/staging/production."
            exit 1
          fi
          echo "✅ Aucune synchro de schema hors migration detectee."

      # ─── Audit sécurité (non bloquant pour l'instant) ────────────────────
      - name: npm audit
        run: npm audit --audit-level=critical
        # Bloque uniquement sur les vulnérabilités CRITIQUES
        # Les HIGH/MODERATE sont documentées dans docs/memory/memorystep2.md §8
        continue-on-error: false

  # ═══════════════════════════════════════════════════════════════════════
  #  Tests TypeScript — fonctions de lib/ et routes Next.js
  #
  #  Ajouté par le plan backend-local (étape 1, défaut F7) : `npm run test:ts`
  #  ne tournait nulle part. Les routes se testent avec un faux Prisma et des
  #  sessions simulées (test/helpers/) : aucun test ne touche la base.
  # ═══════════════════════════════════════════════════════════════════════
  ts-tests:
    name: Tests TypeScript
    runs-on: ubuntu-latest

    env:
      # prisma.config.ts exige la variable dès son chargement, même pour
      # `prisma generate`, qui ne se connecte pas. Une URL factice suffit :
      # le vrai secret n'a rien à faire dans ce job.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Aujourd'hui, seul lib/prisma.ts charge @prisma/client, et les tests de
      # routes le remplacent. Un futur test qui chargerait le client échouerait
      # pourtant sans lui : on le génère, comme dans le job validate.
      - name: Prisma — génération du client
        run: npx prisma generate

      - name: node --test
        run: npm run test:ts

  # ═══════════════════════════════════════════════════════════════════════
  #  Tests Python — backend FastAPI
  #
  #  Ajouté à l'étape 6 de l'audit : la suite de tests n'était lancée nulle
  #  part. Elle échouait depuis un refactor non répercuté sans que personne
  #  ne le voie.
  # ═══════════════════════════════════════════════════════════════════════
  python-tests:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # requirements-dev.txt inclut requirements.txt et y ajoute
        # pytest + pytest-asyncio, qui n'étaient déclarés nulle part.
        run: pip install -r backend/requirements-dev.txt

      - name: pytest
        run: python -m pytest -q
