name: CI — Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Pas de déploiement Vercel — validation uniquement
# Le déploiement sera ajouté dans une étape ultérieure

jobs:
  validate:
    name: Lint, Types & Migrations
    runs-on: ubuntu-latest

    # ─── Base de CI éphémère (plan gestion-contenu, étape 15) ────────────
    # Un Postgres jetable, créé pour le run et détruit après : les
    # migrations s'y jouent depuis une base vierge, sur toutes les branches,
    # sans rien partager (mémo Vercel §11). Même version majeure que Neon.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # La base jetable, pour tout le job. DIRECT_URL aussi : prisma.config.ts
      # la préfère à DATABASE_URL pour migrer (mémo Vercel §11, piège 1) ;
      # laissée sur Neon, elle y enverrait les migrations. Les secrets Neon ne
      # servent qu'à l'étape du statut de la production, sur main.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Même version majeure que le poste de développement (v24.21.0).
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ─── Prisma ───────────────────────────────────────────────────────────
      # DOIT précéder tsc et ESLint. `npm ci` ne génère plus le client : le
      # hook postinstall a disparu avec Prisma 7 et package.json n'en déclare
      # aucun. Sans cette étape, `@prisma/client` n'exporte pas `PrismaClient`
      # (TS2305) et tsc part en cascade de ~40 TS7006 sur tous les callbacks
      # Prisma, qui perdent leur type. C'est ce qui faisait échouer la CI
      # depuis son tout premier run.
      - name: Prisma — génération du client
        run: npx prisma generate

      # ─── TypeScript ───────────────────────────────────────────────────────
      - name: TypeScript — vérification des types
        run: npx tsc --noEmit

      # ─── Lint ─────────────────────────────────────────────────────────────
      - name: ESLint
        run: npm run lint

      - name: Prisma — validation du schéma
        run: npx prisma validate

      # ─── Migrations : sur une base vierge, toutes les branches ───────────
      # Rejoue tout l'historique sur la base jetable : une migration cassée
      # (colonne inexistante, ordre faux, DROP qui échoue) fait échouer le
      # job avant toute relecture, sans toucher à Neon. Puis le statut, sur
      # cette base : il doit dire « à jour ».
      - name: Prisma — migrations sur une base vierge (base jetable)
        run: npx prisma migrate deploy

      - name: Prisma — statut des migrations (base jetable)
        run: npx prisma migrate status

      - name: Prisma — statut des migrations (base de production)
        # Sur main et les PR vers main seulement (D121) : avant une mise en
        # production, dit si la base Neon des secrets, la production (branche
        # Neon main, ep-super-rain), a toutes les migrations du dépôt. Une
        # migration nouvelle s'y applique depuis le poste, avant le push sur
        # main (mémo Vercel §3.1) ; tant qu'elle manque, cette CI est rouge.
        # Ailleurs, l'étape ne tourne pas : une branche n'attend pas la
        # production.
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status

      # ─── Garde-fou : interdire la synchro de schema sans migration ───────
      - name: Sécurité — détecter une synchro de schema hors migration
        run: |
          # Le motif est ecrit en classes de caracteres pour ne PAS se trouver
          # lui-meme : le garde-fou scanne .github/, donc une recherche du
          # litteral matchait sa propre source et echouait systematiquement.
          # C'etait le cas depuis le premier run — masque par l'echec anterieur
          # de tsc, qui empechait d'atteindre cette etape.
          MOTIF='prisma[[:space:]]+db[[:space:]]+push'
          echo "Recherche d'une synchro de schema dans les scripts CI et package.json..."
          if grep -rEn "$MOTIF" .github/ package.json 2>/dev/null; then
            echo "❌ ERREUR : synchro de schema detectee dans un script CI ou package.json."
            echo "   Utiliser 'prisma migrate deploy' en CI/staging/production."
            exit 1
          fi
          echo "✅ Aucune synchro de schema hors migration detectee."

      # ─── Audit sécurité (non bloquant pour l'instant) ────────────────────
      - name: npm audit
        run: npm audit --audit-level=critical
        # Bloque uniquement sur les vulnérabilités CRITIQUES
        # Les HIGH/MODERATE sont documentées dans docs/architecture/gestion-contenu.md §8.3
        continue-on-error: false

  # ═══════════════════════════════════════════════════════════════════════
  #  Tests TypeScript — fonctions de lib/ et routes Next.js
  #
  #  Ajouté par le plan backend-local (étape 1, défaut F7) : `npm run test:ts`
  #  ne tournait nulle part. Les routes se testent avec un faux Prisma et des
  #  sessions simulées (test/helpers/) : aucun test ne touche la base.
  # ═══════════════════════════════════════════════════════════════════════
  ts-tests:
    name: Tests TypeScript
    runs-on: ubuntu-latest

    env:
      # prisma.config.ts exige la variable dès son chargement, même pour
      # `prisma generate`, qui ne se connecte pas. Une URL factice suffit :
      # le vrai secret n'a rien à faire dans ce job.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Indispensable : test/helpers/prisma-schema.ts lit le modèle de données
      # du client généré (`Prisma.dmmf`) pour relire chaque requête des tests
      # de routes contre le vrai schéma. Il ne se connecte à rien.
      - name: Prisma — génération du client
        run: npx prisma generate

      - name: node --test
        run: npm run test:ts
